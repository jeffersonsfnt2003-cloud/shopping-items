<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121217">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catálogo">
<style>
:root{
  --bg:#121217; --card:#1b1b23; --card2:#22222c; --line:#31313d;
  --tx:#e8e8f0; --dim:#9c9cae; --mute:#6c6c7e;
  --acc:#a5a3f5; --amber:#e8b04b; --ok:#5fbf8f; --bad:#e0645f; --warn:#d9a441;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}

html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc)}
.mono{font-family:var(--mono)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 70px}

/* ---------- cabecera ---------- */
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
.rate{font-family:var(--mono);font-size:11.5px;color:var(--mute)}

/* ---------- pestañas ---------- */
.navrow{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.catwrap{flex:1 1 auto;min-width:0;position:relative}
.catlbl{position:absolute;left:12px;top:6px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);font-family:var(--mono);pointer-events:none}
.caret{position:absolute;right:12px;top:50%;transform:translateY(-25%);color:var(--dim);
  font-size:11px;pointer-events:none}
.jump{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:9px;
  padding:20px 28px 8px 12px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer;
  appearance:none;-webkit-appearance:none}
.jump:focus{outline:none;border-color:var(--acc)}
.fbtn{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;
  padding:0 15px;font-size:13.5px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:7px}
.fbtn.abierto{border-color:var(--acc);color:var(--acc)}
.fbtn .pt{width:6px;height:6px;border-radius:50%;background:var(--acc);display:inline-block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 15px;margin-bottom:12px}
.panel h5{margin:0 0 8px;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-family:var(--mono)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:7px;
  padding:10px 12px;font-size:13.5px;font-family:inherit;cursor:pointer;width:100%}
.opt.on{border-color:var(--acc);background:rgba(165,163,245,.10);color:var(--tx);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:16px;
  padding:6px 13px;font-size:12.5px;font-family:inherit;cursor:pointer}
.chip2.on{background:var(--acc);border-color:var(--acc);color:#15151c;font-weight:600}
.cu{font-size:10.5px;opacity:.65;font-family:var(--mono)}
.limpiar{background:none;border:0;color:var(--mute);font-size:12px;font-family:inherit;
  cursor:pointer;padding:10px 0 0;text-decoration:underline}
.busq{margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.busq summary{cursor:pointer;color:var(--dim);font-size:13px;padding:11px 0;list-style:none}
.busq summary::-webkit-details-marker{display:none}
.busq summary::before{content:'\25b8 ';color:var(--mute)}
.busq[open] summary::before{content:'\25be '}
.busq .ayuda{color:var(--mute);font-size:11.5px;margin:0 0 9px}
.terms{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:14px}
.term{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:7px;
  padding:7px 11px;font-size:13.5px;font-family:inherit;cursor:pointer;text-align:left;line-height:1.35}
.term:hover{border-color:var(--acc)}
.term .en{color:var(--mute);font-size:11px;font-family:var(--mono)}
.term.ok{border-color:var(--ok);color:var(--ok)}
.catnote{color:var(--mute);font-size:12.5px;margin:0 0 16px;max-width:80ch}

/* ---------- grilla ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:11px;
  overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;background:#0c0c10;aspect-ratio:1/1;cursor:zoom-in}
.tr{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;
  scroll-behavior:smooth;scrollbar-width:none}
.tr::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}
.sl img{width:100%;height:100%;object-fit:contain}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
  border:1px solid var(--line);background:rgba(12,12,16,.8);color:#fff;cursor:pointer;
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;opacity:0;transition:.15s}
.ph:hover .ar,.ph:focus-within .ar{opacity:1}
@media (hover:none){ .ar{opacity:.9} }
.tr{touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.lb{touch-action:none}
.lb.zm{touch-action:auto}
.ar.p{left:6px}.ar.n{right:6px}
.pill{position:absolute;top:7px;right:8px;font-family:var(--mono);font-size:10px;
  background:rgba(12,12,16,.8);border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--dim)}
.body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.tt{font-size:14px;font-weight:600;line-height:1.3;margin:0}
.dm{font-family:var(--mono);font-size:11px;color:var(--acc);margin:-3px 0 0}
.vol{color:var(--mute)}
.rs{font-size:12.5px;color:var(--dim);margin:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.y{font-family:var(--mono);font-size:20px;color:var(--amber);font-weight:600;line-height:1}
.d{font-family:var(--mono);font-size:13px;color:var(--dim)}
.free{font-size:10px;color:var(--ok);border:1px solid rgba(95,191,143,.3);border-radius:3px;padding:1px 5px}
.acts{display:flex;gap:7px}
.btn{white-space:nowrap}
.cp{flex:0 0 auto;padding:7px 9px;display:flex;align-items:center;justify-content:center}
.cp svg{display:block}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.cplink{display:inline-flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line);
  color:var(--tx);border-radius:7px;padding:9px 15px;font-size:13.5px;font-family:inherit;cursor:pointer;margin-left:8px}
.cplink:hover{border-color:var(--acc);color:var(--acc)}
.cplink.ok{border-color:var(--ok);color:var(--ok)}
.btn{flex:1;text-align:center;border:1px solid var(--line);background:var(--card2);color:var(--tx);
  border-radius:6px;padding:7px 6px;font-size:12.5px;cursor:pointer;text-decoration:none;font-family:inherit}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.go{background:var(--acc);border-color:var(--acc);color:#15151c;font-weight:600}
.btn.go:hover{filter:brightness(1.1);color:#15151c}
.empty{grid-column:1/-1;color:var(--mute);font-size:13.5px;padding:26px;text-align:center;
  border:1px dashed var(--line);border-radius:10px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(6,6,9,.8);backdrop-filter:blur(3px);z-index:90;
  display:none;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto}
.ov.on{display:flex}
.md{background:var(--card);border:1px solid var(--line);border-radius:13px;max-width:820px;width:100%;
  overflow:hidden;position:relative}
.x{position:absolute;top:10px;right:10px;z-index:3;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);background:rgba(12,12,16,.9);color:#fff;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
.mph{background:#0c0c10;height:300px;position:relative;border-bottom:1px solid var(--line)}
.mph .sl img{object-fit:contain}
.mph .ar{opacity:1;width:34px;height:34px;font-size:17px}
.mb{padding:18px 20px 22px}
.mb h2{font-size:18px;margin:0 0 3px;line-height:1.3}
.zh{font-family:var(--mono);font-size:11px;color:var(--mute);margin:0 0 12px;word-break:break-all}
.sp{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:13px 0}
.sp>div{background:var(--card2);padding:7px 10px}
.sp .k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-family:var(--mono)}
.sp .v{font-size:12.5px;margin-top:1px}
.fine{font-size:11.5px;color:var(--mute);margin:-6px 0 0}
.dsc{font-size:13.5px;margin:13px 0}
.diag{background:var(--card2);border-radius:7px;padding:13px;margin:14px 0}
.diag h4,.lb h4{margin:0 0 7px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-family:var(--mono);color:var(--mute)}
.verd{font-family:var(--mono);font-size:12px;margin:0 0 11px}
.diag svg{max-width:100%;height:auto}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.lb{background:var(--card2);border-radius:7px;padding:11px 13px}
.lb.v h4{color:var(--ok)}.lb.r h4{color:var(--warn)}
.lb ul{margin:0;padding-left:16px}.lb li{margin:4px 0;font-size:12.5px;color:var(--dim)}
.raw{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:8px;word-break:break-all}

.lb{position:fixed;inset:0;background:#000;z-index:200;display:none}
.lb.on{display:block}
.lbw{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:0}
.lb img{max-width:100%;max-height:100vh;object-fit:contain;display:block;cursor:zoom-in;margin:auto}
.lb.zm .lbw{align-items:flex-start;justify-content:flex-start}
.lb.zm img{max-width:none;max-height:none;cursor:zoom-out}
.lba{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  border:1px solid #4a4a52;background:rgba(0,0,0,.65);color:#fff;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;z-index:3}
.lba.p{left:12px}.lba.n{right:12px}
.lbx{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid #4a4a52;
  background:rgba(0,0,0,.65);color:#fff;font-size:19px;cursor:pointer;z-index:3;display:flex;
  align-items:center;justify-content:center;padding:0}
.lbc{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;
  color:#c3c3cc;background:rgba(0,0,0,.65);border:1px solid #33333d;border-radius:12px;padding:3px 12px;z-index:3}
.prod{cursor:pointer;position:relative}
.prod.no{opacity:.68;transition:opacity .15s}
.prod.no:hover,.prod.no:focus-within{opacity:1}
.tagno{position:absolute;top:7px;left:8px;z-index:2;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;background:rgba(224,100,95,.16);color:var(--bad);
  border:1px solid rgba(224,100,95,.45);border-radius:10px;padding:2px 8px;backdrop-filter:blur(3px)}
.sb{background:var(--card2);border-radius:8px;padding:13px 15px;margin:14px 0}
.sb h4{margin:0 0 9px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-family:var(--mono);color:var(--mute)}
.sb table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
.sb td{padding:3px 0;color:var(--dim)}
.sb td:last-child{text-align:right;color:var(--tx);white-space:nowrap}
.sb tr.tot td{border-top:1px solid var(--line);padding-top:7px;font-weight:600;font-size:14px;color:var(--tx)}
.sb tr.tot td:last-child{color:var(--amber)}
.sb .obs{font-size:12px;color:var(--mute);margin:9px 0 0;font-family:inherit}
.sb.mal{background:rgba(224,100,95,.07);border-left:2px solid var(--bad)}
.sb.mal h4{color:var(--bad)}
.sb.ojo{background:rgba(217,164,65,.07);border-left:2px solid var(--warn)}
.sb.ojo h4{color:var(--warn)}
.sv{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin:-2px 0 0}
.sv b{color:var(--amber);font-weight:600}
.sv.mal b{color:var(--bad)}
.carro{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--ok);
  border-radius:9px;padding:13px 15px;margin:0 0 16px}
.carro h5{margin:0 0 7px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--ok)}
.carro p{margin:0;font-size:13px;color:var(--dim)}
.carro b{color:var(--tx)}
.motivo{background:rgba(224,100,95,.07);border-left:2px solid var(--bad);border-radius:6px;
  padding:12px 14px;margin:14px 0}
.motivo h4{margin:0 0 6px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  font-family:var(--mono);color:var(--bad)}
.motivo p{margin:0;font-size:13.5px;color:var(--dim)}
.prod:hover{border-color:#454556}
.mph .sl img{cursor:zoom-in}
details.rejs{margin-top:34px;border-top:1px solid var(--line);padding-top:16px}
details.rejs summary{cursor:pointer;color:var(--dim);font-size:13.5px}
.rej{background:var(--card);border-left:2px solid var(--bad);border-radius:6px;padding:10px 13px;margin:9px 0}
.rej b{font-size:13px}.rej p{color:var(--dim);font-size:12.5px;margin:4px 0 0}
footer{margin-top:34px;color:var(--mute);font-size:11.5px;font-family:var(--mono)}
@media(max-width:520px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tt{font-size:13px}.rs{-webkit-line-clamp:2;font-size:11.5px}.y{font-size:17px}
  .ov{padding:0}.md{border-radius:0;min-height:100%}.mph{height:230px}
}

/* ---------- PWA: safe areas, instalar, salida externa ---------- */
.wrap{padding:calc(22px + var(--sat)) calc(16px + var(--sar)) calc(70px + var(--sab)) calc(16px + var(--sal))}
.ov{padding:calc(26px + var(--sat)) calc(14px + var(--sar)) calc(26px + var(--sab)) calc(14px + var(--sal))}
.lbx{top:calc(12px + var(--sat));right:calc(12px + var(--sar))}
.lb .lbw{padding-top:var(--sat);padding-bottom:var(--sab)}

.inst{position:fixed;left:calc(10px + var(--sal));right:calc(10px + var(--sar));
  bottom:calc(10px + var(--sab));z-index:150;background:var(--card2);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;display:none;gap:10px;align-items:flex-start;
  box-shadow:0 10px 30px rgba(0,0,0,.55);max-width:520px;margin:0 auto}
.inst.on{display:flex}
.inst .ic{font-size:20px;line-height:1.2}
.inst p{margin:0;font-size:12.5px;color:var(--dim)}
.inst b{color:var(--tx)}
.inst .ix{margin-left:auto;background:none;border:0;color:var(--mute);font-size:19px;
  cursor:pointer;padding:0 2px;line-height:1}

.hoja{position:fixed;inset:0;z-index:210;background:rgba(6,6,9,.82);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.hoja.on{display:flex}
.hoja .hc{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 0 0;
  width:100%;max-width:520px;padding:16px 16px calc(16px + var(--sab));
  padding-left:calc(16px + var(--sal));padding-right:calc(16px + var(--sar))}
.hoja h4{margin:0 0 6px;font-size:14px}
.hoja p{margin:0 0 12px;font-size:12.5px;color:var(--dim);word-break:break-all}
.hoja .hb{display:flex;gap:8px;flex-wrap:wrap}
.hoja .hb .btn{flex:1 1 auto;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="inst" id="inst">
  <span class="ic">⬇︎</span>
  <p>Instalala como app: tocá <b>Compartir</b> y después <b>Añadir a pantalla de inicio</b>.</p>
  <button class="ix" id="instx" aria-label="Cerrar">&times;</button>
</div>
<div class="hoja" id="hoja"><div class="hc">
  <h4>Abrir fuera de la app</h4>
  <p id="hojau"></p>
  <div class="hb">
    <a class="btn go" id="hojaa" href="#" target="_blank" rel="noopener">Abrir</a>
    <button class="btn" id="hojac">Copiar enlace</button>
    <button class="btn" id="hojax">Cancelar</button>
  </div>
</div></div>
<div class="lb" id="lb">
  <div class="lbw"><img id="lbimg" alt=""></div>
  <button class="lbx" id="lbx" aria-label="Cerrar">&times;</button>
  <button class="lba p" data-ld="-1" aria-label="Anterior">&#8249;</button>
  <button class="lba n" data-ld="1" aria-label="Siguiente">&#8250;</button>
  <span class="lbc" id="lbc"></span>
</div>
<script>
let C,M;
const ICO='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const hi=u=>String(u).replace(/_\d+x\d+Q90/i,'_Q90');
const usd=c=>(c*M.tasa_cny_usd).toFixed(2);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

async function alPortapapeles(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(_){
    try{ const t=document.createElement('textarea'); t.value=txt;
      t.style.cssText='position:fixed;opacity:0;pointer-events:none'; document.body.appendChild(t);
      t.select(); const ok=document.execCommand('copy'); t.remove(); return ok; }
    catch(__){ return false; }
  }
}
function cablearCopias(root){
  root.querySelectorAll('[data-copy]').forEach(b=>{
    b.onclick=async e=>{
      e.stopPropagation();
      if(_arrastro) return;
      const orig=b.innerHTML, ok=await alPortapapeles(b.dataset.copy);
      b.classList.add('ok');
      b.innerHTML = b.dataset.corto!==undefined
        ? (ok?ICO+'\u2713':ICO+'!')
        : (ok?ICO+' Link copiado':ICO+' copialo a mano');
      setTimeout(()=>{ b.classList.remove('ok'); b.innerHTML=orig; }, 1600);
    };
  });
}

function carr(it,cls,grande){
  const im=it.imagenes||[];
  if(!im.length) return '<div class="'+cls+'"></div>';
  return '<div class="'+cls+'" data-c>'
    +'<div class="tr">'+im.map((u,i)=>'<div class="sl"><img src="'+esc(grande?hi(u):u)+'" data-i="'+i+'" loading="lazy" alt="'+esc(it.titulo)+' '+(i+1)+'" referrerpolicy="no-referrer"></div>').join('')+'</div>'
    +'<span class="pill"><b data-cur>1</b>/'+im.length+'</span>'
    +(im.length>1?'<button class="ar p" data-d="-1" aria-label="Anterior">&#8249;</button><button class="ar n" data-d="1" aria-label="Siguiente">&#8250;</button>':'')
    +'</div>';
}

const LAYOUTS={
  flat2x2:{u:[14,10],  cols:2, rows:2, alto:6.5, nom:'4 acostados en 2\u00d72'},
  stack2 :{u:[14,10],  cols:1, rows:2, alto:13,  nom:'2 capas de 2', capas:2},
  edge4  :{u:[14,6.5], cols:2, rows:2, alto:10,  nom:'4 de canto, como libros'}
};
const P2=()=>M.proxy;
const fleteEUB=g=>{const P=P2();return g<=1000?P.eub.g1000:Math.round(P.eub.g1000+(g-1000)/1000*(P.eub.g2000-P.eub.g1000));};
const n2=v=>Math.round(v*100)/100;
function costoSB(it){
  const P=P2(); if(!P||!it.sb||it.sb==='na') return null;
  const e1=n2(it.precio_cny+P.comision_cny);
  if(it.sb==='bloqueado') return {estado:'bloqueado', e1};
  const f = it.sb==='expres' ? P.expres.desde_cny : fleteEUB(it.peso_g||1000);
  return {estado:it.sb, e1, flete:f, total:n2(e1+f),
          dias: it.sb==='expres'?P.expres.dias:P.eub.dias};
}
const volumen=it=>Math.round(it.interior[0]*it.interior[1]*it.interior[2]);

    +'<rect x="'+P+'" y="'+P+'" width="'+px(W)+'" height="'+px(D)+'" fill="rgba(255,255,255,.03)" stroke="'+col+'" stroke-width="2" rx="5"/>'

    +'<rect x="'+rx.toFixed(1)+'" y="'+ry.toFixed(1)+'" width="'+px(rt.largo)+'" height="'+px(rt.ancho)+'" fill="rgba(232,176,75,.13)" stroke="var(--amber)" stroke-width="1.5" rx="7"/>'
    +'<text x="'+(rx+rt.largo*s/2).toFixed(1)+'" y="'+(ry+rt.ancho*s+13).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--amber)">rat\u00f3n</text>'

    +'<text x="'+(P+W*s/2).toFixed(1)+'" y="'+(P+D*s+20).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--mute)">'+libreFre+' cm libres delante del port\u00e1til</text>'

            : 'JUSTO \u2014 solo '+libreDer+' cm a la derecha: el rat\u00f3n cabe pero casi sin recorrido.');

function diagrama(it){
  const [L,W,H]=it.interior, a=M.referencias.adaptador;
  const Y=LAYOUTS[it.encaje.layout]||LAYOUTS.flat2x2;
  const fw=Y.cols*Y.u[0], fh=Y.rows*Y.u[1], alto=Y.alto, sw=L-fw, sh=W-fh;
  const PA=[[a.largo,a.ancho,a.alto],[a.largo,a.alto,a.ancho],[a.ancho,a.largo,a.alto],
            [a.ancho,a.alto,a.largo],[a.alto,a.largo,a.ancho],[a.alto,a.ancho,a.largo]];
  const como=q=>q[2]<=a.alto?'acostado':'de canto';
  let ad=null;
  for(const q of PA) if(q[0]<=sw&&q[1]<=W&&q[2]<=H){ ad={x:fw+(sw-q[0])/2,y:(W-q[1])/2,w:q[0],h:q[1],z:q[2],note:como(q)+' en la franja lateral'}; break; }
  if(!ad) for(const q of PA) if(q[0]<=L&&q[1]<=sh&&q[2]<=H){ ad={x:(L-q[0])/2,y:fh+(sh-q[1])/2,w:q[0],h:q[1],z:q[2],note:como(q)+' en la franja de atr\u00e1s'}; break; }
  if(!ad) for(const q of PA) if(q[0]<=L&&q[1]<=W&&q[2]<=H-alto){ ad={above:1,z:q[2],note:'encima, en el hueco de la tapa'}; break; }
  const ok=fw<=L&&fh<=W&&alto<=H&&ad, col=ok?'var(--ok)':'var(--bad)';
  const s=Math.min(380/L,215/W), P=30, px=n=>(n*s).toFixed(1);
  let mn='';
  for(let r=0;r<Y.rows;r++)for(let c=0;c<Y.cols;c++){
    const x=P+c*Y.u[0]*s, y=P+r*Y.u[1]*s;
    mn+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+px(Y.u[0])+'" height="'+px(Y.u[1])+'" fill="rgba(165,163,245,.10)" stroke="var(--acc)" stroke-width="1.5" rx="3"/>'
      +'<text x="'+(x+Y.u[0]*s/2).toFixed(1)+'" y="'+(y+Y.u[1]*s/2+4).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--acc)">'+(Y.capas===2?'\u00d72':'mando')+'</text>';
  }
  const adr=(ad&&!ad.above)?'<rect x="'+(P+ad.x*s).toFixed(1)+'" y="'+(P+ad.y*s).toFixed(1)+'" width="'+px(ad.w)+'" height="'+px(ad.h)+'" fill="rgba(232,176,75,.13)" stroke="var(--amber)" stroke-width="1.5" rx="2"/><text x="'+(P+(ad.x+ad.w/2)*s).toFixed(1)+'" y="'+(P+(ad.y+ad.h/2)*s+4).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--amber)">adapt.</text>':'';
  const planta='<svg viewBox="0 0 '+(L*s+P*2).toFixed(0)+' '+(W*s+P*2+14).toFixed(0)+'" width="'+(L*s+P*2).toFixed(0)+'">'
    +'<rect x="'+P+'" y="'+P+'" width="'+px(L)+'" height="'+px(W)+'" fill="rgba(255,255,255,.025)" stroke="'+col+'" stroke-width="2" rx="4"/>'+mn+adr
    +'<text x="'+(P+L*s/2).toFixed(1)+'" y="'+(P-10)+'" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--dim)">'+L+' cm</text>'
    +'<text x="'+(P-11)+'" y="'+(P+W*s/2).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--dim)" transform="rotate(-90 '+(P-11)+' '+(P+W*s/2).toFixed(1)+')">'+W+' cm</text>'
    +'<text x="'+(P+L*s/2).toFixed(1)+'" y="'+(P+W*s+20).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--mute)">planta</text></svg>';
  const s2=Math.min(380/L,110/H), Q=30, hb=alto*s2, ah=(ad&&ad.z?ad.z:a.alto)*s2;
  const adA=ad?(ad.above
    ?'<rect x="'+(Q+4)+'" y="'+(Q+H*s2-hb-ah-3).toFixed(1)+'" width="'+((ad&&ad.w?ad.w:a.largo)*s2).toFixed(1)+'" height="'+ah.toFixed(1)+'" fill="rgba(232,176,75,.13)" stroke="var(--amber)" stroke-width="1.5" rx="2"/>'
    :'<rect x="'+(Q+fw*s2+4).toFixed(1)+'" y="'+(Q+H*s2-ah-2).toFixed(1)+'" width="'+((ad&&ad.w?ad.w:a.largo)*s2).toFixed(1)+'" height="'+ah.toFixed(1)+'" fill="rgba(232,176,75,.13)" stroke="var(--amber)" stroke-width="1.5" rx="2"/>'):'';
  const alz='<svg viewBox="0 0 '+(L*s2+Q*2).toFixed(0)+' '+(H*s2+Q*2+14).toFixed(0)+'" width="'+(L*s2+Q*2).toFixed(0)+'">'
    +'<rect x="'+Q+'" y="'+Q+'" width="'+(L*s2).toFixed(1)+'" height="'+(H*s2).toFixed(1)+'" fill="rgba(255,255,255,.025)" stroke="'+col+'" stroke-width="2" rx="4"/>'
    +'<rect x="'+(Q+2)+'" y="'+(Q+H*s2-hb-2).toFixed(1)+'" width="'+(fw*s2).toFixed(1)+'" height="'+hb.toFixed(1)+'" fill="rgba(165,163,245,.10)" stroke="var(--acc)" stroke-width="1.5" rx="3"/>'
    +'<text x="'+(Q+fw*s2/2).toFixed(1)+'" y="'+(Q+H*s2-hb/2+4).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--acc)">'+alto+' cm</text>'+adA
    +'<text x="'+(Q+L*s2+11)+'" y="'+(Q+H*s2/2+4).toFixed(1)+'" font-family="var(--mono)" font-size="11" fill="var(--dim)">'+H+' cm</text>'
    +'<text x="'+(Q+L*s2/2).toFixed(1)+'" y="'+(Q+H*s2+20).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--mute)">alzado</text></svg>';
  const t=ok?('ENTRA \u2014 '+Y.nom+': ocupan '+fw+' \u00d7 '+fh+' \u00d7 '+alto+' cm. Adaptador '+ad.note+'. Sobran '+(L-fw).toFixed(1)+' / '+(W-fh).toFixed(1)+' / '+(H-alto).toFixed(1)+' cm.')
    :('NO ENTRA en esta disposici\u00f3n.');
  return '<div class="diag"><h4>Encaje \u2014 planta y alzado, a escala \u00b7 '+volumen(it).toLocaleString('es')+' cm\u00b3</h4><p class="verd" style="color:'+col+'">'+t+'</p>'+planta+alz+'</div>';
}

function activarCarr(root){
  root.querySelectorAll('[data-c]').forEach(c=>{
    const tr=c.querySelector('.tr'), cur=c.querySelector('[data-cur]');
    const i=()=>Math.round(tr.scrollLeft/tr.clientWidth);
    c.querySelectorAll('.ar').forEach(b=>b.onclick=e=>{
      e.stopPropagation(); const n=tr.children.length;
      tr.scrollTo({left:((i()+Number(b.dataset.d)+n)%n)*tr.clientWidth});
    });
    tr.addEventListener('scroll',()=>{if(cur)cur.textContent=i()+1;},{passive:true});
  });
}

    orden==='precio_asc'  ? a.precio_cny-b.precio_cny :

    ((a.interior?volumen(a):1e9)-(b.interior?volumen(b):1e9))||a.precio_cny-b.precio_cny);
  let vis=C.items.filter(i=>(filtro==='todos'||i.categoria===filtro)&&(!pmax||i.precio_cny<=pmax));
  vis = ordenar(vis);
  document.getElementById('app').innerHTML=
    '<header><h1>Catálogo</h1><span class="rate">1 ¥ = US$ '+M.tasa_cny_usd+' · '+M.tasa_fecha+' · goofish.com</span></header>'
    +controles()
    +(cat?'<p class="catnote">'+esc(cat.objetivo)+'</p>':'<p class="catnote">Todo lo verificado, en todas las categorías.</p>')
    +(function(){
        const P=M.proxy; if(!P) return '';
        const el=vis.filter(i=>i.sb==='eub'&&i.peso_g).slice().sort((x,y)=>y.peso_g-x.peso_g);
        if(el.length<2) return '';
        const prod=n2(el.reduce((a,i)=>a+i.precio_cny,0));
        const com=P.comision_cny*el.length;
        const peso=el.reduce((a,i)=>a+i.peso_g,0);
        const paq=[];                                   // reparto voraz en cajas de <=2 kg
        el.forEach(i=>{ const c=paq.find(x=>x.g+i.peso_g<=P.eub.limite_peso_g);
                        if(c){c.g+=i.peso_g;} else paq.push({g:i.peso_g}); });
        const fl=paq.reduce((a,x)=>a+fleteEUB(x.g),0);
        const juntos=n2(prod+com+fl);
        const sueltos=n2(el.reduce((a,i)=>a+costoSB(i).total,0));
        const ahorro=n2(sueltos-juntos);
        if(ahorro<=0) return '';
        return '<div class="carro"><h5>Comprarlos juntos sale m\u00e1s barato</h5><p>'
          +esc(P.nombre)+' consolida varios \u00edtems en un paquete sin costo. Los <b>'+el.length+'</b> art\u00edculos que viajan por correo econ\u00f3mico pesan <b>'+peso+' g</b> y entran en <b>'+paq.length+' paquete'+(paq.length>1?'s':'')+'</b> de hasta '+(P.eub.limite_peso_g/1000)+' kg: '
          +'<b>US$ '+usd(juntos)+'</b> en total, contra <b>US$ '+usd(sueltos)+'</b> comprados uno por uno. '
          +'Ahorro: <b>US$ '+usd(ahorro)+'</b>. La comisi\u00f3n de \u00a5'+P.comision_cny+' se paga igual por cada \u00edtem; lo que se reparte es el flete.</p></div>';
      })()
    +((cat&&cat.busquedas&&cat.busquedas.length)
      ? '<details class="busq"><summary>Buscar por mi cuenta en Goofish ('+cat.busquedas.length+' t\u00e9rminos)</summary>'
        +'<p class="ayuda">Toc\u00e1 un t\u00e9rmino y se copia en chino. Peg\u00e1lo en el buscador de goofish.com.</p>'
        +'<div class="terms">'+cat.busquedas.map(t=>
            '<button class="term" data-zh="'+esc(t.zh)+'">'+esc(t.zh)+'<br><span class="en">'+esc(t.en)+'</span></button>').join('')
        +'</div></details>'
      : '')
    +'<div class="grid">'+(vis.length?vis.map(tarjeta).join(''):'<div class="empty">Nada coincide con estos filtros.</div>')+'</div>'
    +(function(){
        const d=ordenar(C.descartados.filter(x=>(filtro==='todos'||x.categoria===filtro)&&(!pmax||x.precio_cny<=pmax)));
        if(!d.length) return '';
        return '<details class="rejs"><summary>Descartados y por qu\u00e9 ('+d.length+')</summary>'
          +'<div class="grid" style="margin-top:14px">'+d.map(tarjeta).join('')+'</div></details>';
      })()
    +'<footer>Miniaturas servidas por el CDN de Goofish. Última actualización: '+M.tasa_fecha+'.</footer>';
  activarCarr(document.getElementById('app'));
  document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=e=>{e.stopPropagation();abrir(b.dataset.ver);});
  document.querySelectorAll('[data-stop]').forEach(a=>a.onclick=e=>e.stopPropagation());
  cablearCopias(document.getElementById('app'));
  document.querySelectorAll('[data-open]').forEach(c=>{
    c.onclick=()=>{ if(_arrastro) return; abrir(c.dataset.open); };
    const ph=c.querySelector('.ph');
    if(ph) ph.onclick=e=>{
      if(e.target.closest('.ar')) return;          // las flechas hacen lo suyo
      e.stopPropagation();                          // no abrir el detalle
      if(_arrastro) return;                         // fue un deslizamiento
      const it=C.items.find(x=>x.id===c.dataset.open)||C.descartados.find(x=>x.id===c.dataset.open);
      if(!it||!it.imagenes||!it.imagenes.length) return;
      const tr=ph.querySelector('.tr');
      const i=tr&&tr.clientWidth?Math.round(tr.scrollLeft/tr.clientWidth):0;
      verFoto(it.imagenes, Math.min(i, it.imagenes.length-1));
    };
  });
  const j=document.getElementById('jump');
  if(j) j.onchange=()=>{ filtro=j.value||'todos'; pintar(); window.scrollTo({top:0}); };
  document.querySelectorAll('[data-zh]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const zh=b.dataset.zh, orig=b.innerHTML;
    const ok=await alPortapapeles(zh);
    b.classList.add('ok');
    b.innerHTML = ok ? '\u2713 copiado<br><span class="en">'+esc(zh)+'</span>'
                     : zh+'<br><span class="en">copialo a mano</span>';
    setTimeout(()=>{ b.classList.remove('ok'); b.innerHTML=orig; }, 1600);
  });

  const fb=document.getElementById('fbtn');
  if(fb) fb.onclick=()=>{ panel=!panel; pintar(); };
  document.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{ orden=b.dataset.ord; pintar(); });
  document.querySelectorAll('[data-tope]').forEach(b=>b.onclick=()=>{ pmax=Number(b.dataset.tope)||0; pintar(); });
  const lp=document.getElementById('limpiar');
  if(lp) lp.onclick=()=>{ pmax=0; orden='vol'; pintar(); };
}

// --- distinguir un toque de un arrastre, para que deslizar no abra el detalle ---
let _x0=0,_y0=0,_arrastro=false;
addEventListener('pointerdown',e=>{_x0=e.clientX;_y0=e.clientY;_arrastro=false;},{capture:true,passive:true});
addEventListener('pointermove',e=>{ if(Math.abs(e.clientX-_x0)>8||Math.abs(e.clientY-_y0)>8) _arrastro=true; },{capture:true,passive:true});

const ov=document.getElementById('ov'), md=document.getElementById('md');
const lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg'), lbc=document.getElementById('lbc');
let lbFotos=[], lbIdx=0;
function verFoto(imgs,i){
  lbFotos=imgs.map(hi); lbIdx=i; lb.classList.add('on'); lb.classList.remove('zm');
  document.body.style.overflow='hidden'; pintarFoto();
}
function pintarFoto(){ lbimg.src=lbFotos[lbIdx]; lbc.textContent=(lbIdx+1)+' / '+lbFotos.length;
  lb.querySelector('.lbw').scrollTo(0,0);
  lb.querySelectorAll('.lba').forEach(b=>b.style.display=lbFotos.length>1?'flex':'none'); }
function moverFoto(d){ lbIdx=(lbIdx+d+lbFotos.length)%lbFotos.length; lb.classList.remove('zm'); pintarFoto(); }
function cerrarFoto(){ lb.classList.remove('on','zm'); lbimg.src=''; if(!ov.classList.contains('on')) document.body.style.overflow=''; }
lb.querySelectorAll('.lba').forEach(b=>b.onclick=e=>{e.stopPropagation();moverFoto(Number(b.dataset.ld));});
document.getElementById('lbx').onclick=cerrarFoto;
lbimg.onclick=e=>{ e.stopPropagation(); if(_arrastro) return; lb.classList.toggle('zm'); };
lb.onclick=e=>{ if(_arrastro) return; if(e.target===lb||e.target.classList.contains('lbw'))cerrarFoto(); };
// deslizar con el dedo dentro del visor
let _tx=null,_ty=null;
lb.addEventListener('touchstart',e=>{ if(e.touches.length===1){_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;} },{passive:true});
lb.addEventListener('touchend',e=>{
  if(_tx===null||lb.classList.contains('zm')){_tx=null;return;}
  const dx=e.changedTouches[0].clientX-_tx, dy=e.changedTouches[0].clientY-_ty; _tx=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)) moverFoto(dx<0?1:-1);
  else if(dy>70&&Math.abs(dy)>Math.abs(dx)) cerrarFoto();
},{passive:true});
// arrastrar con el ratón en escritorio
let _mx=null;
lb.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&!lb.classList.contains('zm')) _mx=e.clientX; });
lb.addEventListener('pointerup',e=>{ if(_mx===null)return; const dx=e.clientX-_mx; _mx=null;
  if(Math.abs(dx)>60) moverFoto(dx<0?1:-1); });
function abrir(id){
  const it=C.items.find(x=>x.id===id)||C.descartados.find(x=>x.id===id); if(!it)return;
  md.innerHTML=detalle(it); ov.classList.add('on'); document.body.style.overflow='hidden';
  activarCarr(md); document.getElementById('cx').onclick=cerrar; md.scrollIntoView();
  cablearCopias(md);
  md.querySelectorAll('.mph .sl img').forEach(im=>im.onclick=e=>{
    e.stopPropagation(); verFoto(it.imagenes, Number(im.dataset.i)||0); });
}
function cerrar(){ov.classList.remove('on');md.innerHTML='';document.body.style.overflow='';}
ov.onclick=e=>{if(e.target===ov)cerrar();};
document.addEventListener('keydown',e=>{
  if(lb.classList.contains('on')){
    if(e.key==='Escape')cerrarFoto();
    if(e.key==='ArrowRight')moverFoto(1);
    if(e.key==='ArrowLeft')moverFoto(-1);
    return;
  }
  if(e.key==='Escape')cerrar();
});
/* ---------- PWA: instalado, links externos ---------- */
const APP_STANDALONE = (function(){
  try{ return window.matchMedia('(display-mode: standalone)').matches
       || window.matchMedia('(display-mode: minimal-ui)').matches
       || window.navigator.standalone === true; }catch(_){ return false; }
})();
const ES_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if(APP_STANDALONE) document.documentElement.classList.add('app');

const hoja=document.getElementById('hoja'), hojau=document.getElementById('hojau'),
      hojaa=document.getElementById('hojaa');
function abrirHoja(u){ hojau.textContent=u; hojaa.href=u; hoja.classList.add('on'); }
function cerrarHoja(){ hoja.classList.remove('on'); }
document.getElementById('hojax').onclick=cerrarHoja;
hoja.onclick=e=>{ if(e.target===hoja) cerrarHoja(); };
hojaa.onclick=()=>setTimeout(cerrarHoja,150);
document.getElementById('hojac').onclick=async function(){
  const b=this, o=b.textContent;
  b.textContent = (await alPortapapeles(hojau.textContent)) ? 'Copiado' : 'No se pudo';
  setTimeout(()=>{ b.textContent=o; },1400);
};

/* En la app instalada interceptamos los enlaces externos: nunca navegamos el
   webview de la app (en iOS eso te deja sin botón de volver). Pedimos al sistema
   que lo abra en su capa in-app; si el navegador lo bloquea, mostramos la hoja. */
document.addEventListener('click', e=>{
  if(!APP_STANDALONE) return;
  const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
  if(!a || a.id==='hojaa') return;   /* el botón de la propia hoja sí sale */
  let d; try{ d=new URL(a.getAttribute('href'), location.href); }catch(_){ return; }
  if(d.protocol!=='http:' && d.protocol!=='https:') return;
  if(d.origin===location.origin) return;
  e.preventDefault(); e.stopPropagation();
  let w=null; try{ w=window.open(d.href,'_blank','noopener'); }catch(_){}
  if(!w) abrirHoja(d.href);
}, true);

/* iOS no ofrece prompt de instalación: se lo recordamos una vez. */
(function(){
  if(APP_STANDALONE || !ES_IOS) return;
  let off=false; try{ off = localStorage.getItem('inst_off')==='1'; }catch(_){}
  if(off) return;
  const b=document.getElementById('inst');
  setTimeout(()=>b.classList.add('on'), 1200);
  document.getElementById('instx').onclick=()=>{
    b.classList.remove('on');
    try{ localStorage.setItem('inst_off','1'); }catch(_){}
  };
})();

(function cargar(){
  const s=document.createElement('script');
  s.src='data/items.js?v='+Math.floor(Date.now()/300000);
  s.onload=()=>{ C=window.CATALOGO; M=C.meta; pintar(); };
  s.onerror=()=>{ document.getElementById('app').innerHTML=
    '<p class="err">No se pudieron cargar los datos del catálogo (data/items.js).</p>'; };
  document.head.appendChild(s);
})();
</script>
