<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo</title>
<style>
:root{
  --bg:#121217; --card:#1b1b23; --card2:#22222c; --line:#31313d;
  --tx:#e8e8f0; --dim:#9c9cae; --mute:#6c6c7e;
  --acc:#a5a3f5; --amber:#e8b04b; --ok:#5fbf8f; --bad:#e0645f; --warn:#d9a441;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc)}
.mono{font-family:var(--mono)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 70px}

/* ---------- cabecera ---------- */
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
.rate{font-family:var(--mono);font-size:11.5px;color:var(--mute)}

/* ---------- pestañas ---------- */
nav.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:6px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:20px;padding:6px 14px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#15151c;font-weight:600}
.tab .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}
.catnote{color:var(--mute);font-size:12.5px;margin:0 0 16px;max-width:80ch}

/* ---------- grilla ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:11px;
  overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;background:#0c0c10;aspect-ratio:1/1}
.tr{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;
  scroll-behavior:smooth;scrollbar-width:none}
.tr::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}
.sl img{width:100%;height:100%;object-fit:contain}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
  border:1px solid var(--line);background:rgba(12,12,16,.8);color:#fff;cursor:pointer;
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;opacity:0;transition:.15s}
.ph:hover .ar,.ph:focus-within .ar{opacity:1}
.ar.p{left:6px}.ar.n{right:6px}
.pill{position:absolute;top:7px;right:8px;font-family:var(--mono);font-size:10px;
  background:rgba(12,12,16,.8);border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--dim)}
.body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.tt{font-size:14px;font-weight:600;line-height:1.3;margin:0}
.dm{font-family:var(--mono);font-size:11px;color:var(--acc);margin:-3px 0 0}
.rs{font-size:12.5px;color:var(--dim);margin:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.y{font-family:var(--mono);font-size:20px;color:var(--amber);font-weight:600;line-height:1}
.d{font-family:var(--mono);font-size:13px;color:var(--dim)}
.free{font-size:10px;color:var(--ok);border:1px solid rgba(95,191,143,.3);border-radius:3px;padding:1px 5px}
.acts{display:flex;gap:7px}
.btn{white-space:nowrap}
.btn{flex:1;text-align:center;border:1px solid var(--line);background:var(--card2);color:var(--tx);
  border-radius:6px;padding:7px 6px;font-size:12.5px;cursor:pointer;text-decoration:none;font-family:inherit}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.go{background:var(--acc);border-color:var(--acc);color:#15151c;font-weight:600}
.btn.go:hover{filter:brightness(1.1);color:#15151c}
.empty{grid-column:1/-1;color:var(--mute);font-size:13.5px;padding:26px;text-align:center;
  border:1px dashed var(--line);border-radius:10px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(6,6,9,.8);backdrop-filter:blur(3px);z-index:90;
  display:none;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto}
.ov.on{display:flex}
.md{background:var(--card);border:1px solid var(--line);border-radius:13px;max-width:820px;width:100%;
  overflow:hidden;position:relative}
.x{position:absolute;top:10px;right:10px;z-index:3;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);background:rgba(12,12,16,.9);color:#fff;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
.mph{background:#0c0c10;height:300px;position:relative;border-bottom:1px solid var(--line)}
.mph .sl img{object-fit:contain}
.mph .ar{opacity:1;width:34px;height:34px;font-size:17px}
.mb{padding:18px 20px 22px}
.mb h2{font-size:18px;margin:0 0 3px;line-height:1.3}
.zh{font-family:var(--mono);font-size:11px;color:var(--mute);margin:0 0 12px;word-break:break-all}
.sp{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:13px 0}
.sp>div{background:var(--card2);padding:7px 10px}
.sp .k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-family:var(--mono)}
.sp .v{font-size:12.5px;margin-top:1px}
.fine{font-size:11.5px;color:var(--mute);margin:-6px 0 0}
.dsc{font-size:13.5px;margin:13px 0}
.diag{background:var(--card2);border-radius:7px;padding:13px;margin:14px 0}
.diag h4,.lb h4{margin:0 0 7px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-family:var(--mono);color:var(--mute)}
.verd{font-family:var(--mono);font-size:12px;margin:0 0 11px}
.diag svg{max-width:100%;height:auto}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.lb{background:var(--card2);border-radius:7px;padding:11px 13px}
.lb.v h4{color:var(--ok)}.lb.r h4{color:var(--warn)}
.lb ul{margin:0;padding-left:16px}.lb li{margin:4px 0;font-size:12.5px;color:var(--dim)}
.raw{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:8px;word-break:break-all}

details.rejs{margin-top:34px;border-top:1px solid var(--line);padding-top:16px}
details.rejs summary{cursor:pointer;color:var(--dim);font-size:13.5px}
.rej{background:var(--card);border-left:2px solid var(--bad);border-radius:6px;padding:10px 13px;margin:9px 0}
.rej b{font-size:13px}.rej p{color:var(--dim);font-size:12.5px;margin:4px 0 0}
footer{margin-top:34px;color:var(--mute);font-size:11.5px;font-family:var(--mono)}
@media(max-width:520px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tt{font-size:13px}.rs{-webkit-line-clamp:2;font-size:11.5px}.y{font-size:17px}
  .ov{padding:0}.md{border-radius:0;min-height:100%}.mph{height:230px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<script src="data/items.js"></script>
<script>
const C=window.CATALOGO, M=C.meta;
const usd=c=>(c*M.tasa_cny_usd).toFixed(2);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function carr(it,cls){
  const im=it.imagenes||[];
  if(!im.length) return '<div class="'+cls+'"></div>';
  return '<div class="'+cls+'" data-c>'
    +'<div class="tr">'+im.map((u,i)=>'<div class="sl"><img src="'+esc(u)+'" loading="lazy" alt="'+esc(it.titulo)+' '+(i+1)+'" referrerpolicy="no-referrer"></div>').join('')+'</div>'
    +'<span class="pill"><b data-cur>1</b>/'+im.length+'</span>'
    +(im.length>1?'<button class="ar p" data-d="-1" aria-label="Anterior">&#8249;</button><button class="ar n" data-d="1" aria-label="Siguiente">&#8250;</button>':'')
    +'</div>';
}

function diagrama(it){
  const [L,W,H]=it.interior, m=M.referencias.mando_gamecube, a=M.referencias.adaptador;
  const st=it.encaje.layout==='stack2', cols=st?1:2, capas=st?2:1;
  const fw=cols*m.largo, fh=2*m.ancho, alto=capas*m.alto, sw=L-fw, sh=W-fh;
  let ad=null;
  if(sw>=a.largo&&W>=a.ancho) ad={x:fw+(sw-a.largo)/2,y:(W-a.ancho)/2,w:a.largo,h:a.ancho,note:'acostado en la franja lateral'};
  else if(sw>=a.ancho&&W>=a.largo) ad={x:fw+(sw-a.ancho)/2,y:(W-a.largo)/2,w:a.ancho,h:a.largo,note:'de canto en la franja lateral'};
  else if(sh>=a.ancho&&L>=a.largo) ad={x:(L-a.largo)/2,y:fh+(sh-a.ancho)/2,w:a.largo,h:a.ancho,note:'acostado en la franja inferior'};
  else if(sh>=a.largo&&L>=a.ancho) ad={x:(L-a.ancho)/2,y:fh+(sh-a.largo)/2,w:a.ancho,h:a.largo,note:'de canto en la franja inferior'};
  else if(H-alto>=a.alto) ad={above:1,note:'encima de los mandos, en el hueco de la tapa'};
  const ok=fw<=L&&fh<=W&&alto<=H&&ad, col=ok?'var(--ok)':'var(--bad)';
  const s=Math.min(380/L,215/W), P=30, px=n=>(n*s).toFixed(1);
  let mn='';
  for(let r=0;r<2;r++)for(let c=0;c<cols;c++){
    const x=P+c*m.largo*s, y=P+r*m.ancho*s;
    mn+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+px(m.largo)+'" height="'+px(m.ancho)+'" fill="rgba(165,163,245,.10)" stroke="var(--acc)" stroke-width="1.5" rx="3"/>'
      +'<text x="'+(x+m.largo*s/2).toFixed(1)+'" y="'+(y+m.ancho*s/2+4).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--acc)">'+(st?'x2 capas':'mando')+'</text>';
  }
  const adr=(ad&&!ad.above)?'<rect x="'+(P+ad.x*s).toFixed(1)+'" y="'+(P+ad.y*s).toFixed(1)+'" width="'+px(ad.w)+'" height="'+px(ad.h)+'" fill="rgba(232,176,75,.13)" stroke="var(--amber)" stroke-width="1.5" rx="2"/><text x="'+(P+(ad.x+ad.w/2)*s).toFixed(1)+'" y="'+(P+(ad.y+ad.h/2)*s+4).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--amber)">adapt.</text>':'';
  const planta='<svg viewBox="0 0 '+(L*s+P*2).toFixed(0)+' '+(W*s+P*2+14).toFixed(0)+'" width="'+(L*s+P*2).toFixed(0)+'">'
    +'<rect x="'+P+'" y="'+P+'" width="'+px(L)+'" height="'+px(W)+'" fill="rgba(255,255,255,.025)" stroke="'+col+'" stroke-width="2" rx="4"/>'+mn+adr
    +'<text x="'+(P+L*s/2).toFixed(1)+'" y="'+(P-10)+'" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--dim)">'+L+' cm</text>'
    +'<text x="'+(P-11)+'" y="'+(P+W*s/2).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--dim)" transform="rotate(-90 '+(P-11)+' '+(P+W*s/2).toFixed(1)+')">'+W+' cm</text>'
    +'<text x="'+(P+L*s/2).toFixed(1)+'" y="'+(P+W*s+20).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--mute)">planta</text></svg>';
  const s2=Math.min(380/L,110/H), Q=30, hb=alto*s2, ah=a.alto*s2;
  const adA=ad?(ad.above
      ?'<rect x="'+(Q+4)+'" y="'+(Q+H*s2-hb-ah-3).toFixed(1)+'" width="'+(a.largo*s2).toFixed(1)+'" height="'+ah.toFixed(1)+'" fill="rgba(232,176,75,.13)" stroke="var(--amber)" stroke-width="1.5" rx="2"/>'
      :'<rect x="'+(Q+fw*s2+4).toFixed(1)+'" y="'+(Q+H*s2-ah-2).toFixed(1)+'" width="'+(a.largo*s2).toFixed(1)+'" height="'+ah.toFixed(1)+'" fill="rgba(232,176,75,.13)" stroke="var(--amber)" stroke-width="1.5" rx="2"/>'):'';
  const alz='<svg viewBox="0 0 '+(L*s2+Q*2).toFixed(0)+' '+(H*s2+Q*2+14).toFixed(0)+'" width="'+(L*s2+Q*2).toFixed(0)+'">'
    +'<rect x="'+Q+'" y="'+Q+'" width="'+(L*s2).toFixed(1)+'" height="'+(H*s2).toFixed(1)+'" fill="rgba(255,255,255,.025)" stroke="'+col+'" stroke-width="2" rx="4"/>'
    +'<rect x="'+(Q+2)+'" y="'+(Q+H*s2-hb-2).toFixed(1)+'" width="'+(fw*s2).toFixed(1)+'" height="'+hb.toFixed(1)+'" fill="rgba(165,163,245,.10)" stroke="var(--acc)" stroke-width="1.5" rx="3"/>'
    +'<text x="'+(Q+fw*s2/2).toFixed(1)+'" y="'+(Q+H*s2-hb/2+4).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--acc)">'+(capas===2?'2 capas = ':'')+alto+' cm</text>'+adA
    +'<text x="'+(Q+L*s2+11)+'" y="'+(Q+H*s2/2+4).toFixed(1)+'" font-family="var(--mono)" font-size="11" fill="var(--dim)">'+H+' cm</text>'
    +'<text x="'+(Q+L*s2/2).toFixed(1)+'" y="'+(Q+H*s2+20).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--mute)">alzado</text></svg>';
  const t=ok?('ENTRA — '+(st?'2 capas de 2':'4 en 2x2 plano')+' ocupan '+fw+' x '+fh+' x '+alto+' cm. Adaptador '+ad.note+'. Sobran '+(L-fw).toFixed(1)+' / '+(W-fh).toFixed(1)+' / '+(H-alto).toFixed(1)+' cm.')
    :('NO ENTRA. Hacen falta '+fw+' x '+fh+' x '+alto+' cm más el adaptador; el interior es '+L+' x '+W+' x '+H+'.');
  return '<div class="diag"><h4>Encaje — planta y alzado, a escala</h4><p class="verd" style="color:'+col+'">'+t+'</p>'+planta+alz+'</div>';
}

function tarjeta(it){
  return '<article class="prod">'+carr(it,'ph')+'<div class="body">'
    +'<h3 class="tt">'+esc(it.titulo)+'</h3>'
    +'<p class="dm">interior '+it.interior.join(' x ')+' cm</p>'
    +'<p class="rs">'+esc(it.resumen||it.descripcion)+'</p>'
    +'<div class="pr"><span class="y">&yen;'+it.precio_cny+'</span><span class="d">US$ '+usd(it.precio_cny)+'</span>'
    +(it.envio==='incluido'?'<span class="free">envío incl.</span>':'')+'</div>'
    +'<div class="acts"><button class="btn" data-ver="'+it.id+'">Detalle</button>'
    +'<a class="btn go" href="'+esc(it.url)+'" target="_blank" rel="noopener">Goofish</a></div>'
    +'</div></article>';
}

function detalle(it){
  const v=it.vendedor||{};
  const vend=(v.nombre&&v.nombre!=='no declarado en la ficha')
    ? esc(v.nombre)+' · '+esc(v.ciudad)+' · '+Number(v.ventas).toLocaleString('es')+' ventas · '+esc(v.reputacion)
    : 'no declarado en el anuncio';
  return '<button class="x" id="cx" aria-label="Cerrar">&times;</button>'+carr(it,'mph')+'<div class="mb">'
    +'<h2>'+esc(it.titulo)+'</h2><p class="zh">'+esc(it.titulo_zh)+'</p>'
    +'<div class="pr"><span class="y">&yen;'+it.precio_cny+'</span><span class="d">US$ '+usd(it.precio_cny)+'</span>'
    +(it.envio==='incluido'?'<span class="free">envío incluido</span>':'')+'</div>'
    +'<div class="sp">'
      +'<div><div class="k">Interior</div><div class="v mono">'+it.interior.join(' x ')+' cm</div></div>'
      +'<div><div class="k">Material</div><div class="v">'+esc(it.material)+'</div></div>'
      +'<div><div class="k">Color</div><div class="v">'+esc(it.color)+'</div></div>'
      +'<div><div class="k">Condición</div><div class="v">'+esc(it.condicion)+'</div></div>'
      +'<div><div class="k">Vendedor</div><div class="v" style="font-size:11.5px">'+vend+'</div></div>'
    +'</div><p class="fine">'+esc(it.interior_detalle)+'</p>'
    +'<p class="dsc">'+esc(it.descripcion)+'</p>'+diagrama(it)
    +'<div class="lists">'
      +'<div class="lb v"><h4>Verificado en las fotos</h4><ul>'+it.verificacion.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'
      +'<div class="lb r"><h4>Reservas</h4><ul>'+it.reservas.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'
    +'</div>'
    +'<a class="btn go" style="display:inline-block;padding:9px 18px" href="'+esc(it.url)+'" target="_blank" rel="noopener">Ver en Goofish &rarr;</a>'
    +'<div class="raw">'+esc(it.url)+'</div></div>';
}

function activarCarr(root){
  root.querySelectorAll('[data-c]').forEach(c=>{
    const tr=c.querySelector('.tr'), cur=c.querySelector('[data-cur]');
    const i=()=>Math.round(tr.scrollLeft/tr.clientWidth);
    c.querySelectorAll('.ar').forEach(b=>b.onclick=e=>{
      e.stopPropagation(); const n=tr.children.length;
      tr.scrollTo({left:((i()+Number(b.dataset.d)+n)%n)*tr.clientWidth});
    });
    tr.addEventListener('scroll',()=>{if(cur)cur.textContent=i()+1;},{passive:true});
  });
}

let filtro='todos';
function pintar(){
  const cats=C.categorias;
  const tabs='<button class="tab'+(filtro==='todos'?' on':'')+'" data-f="todos">Todos<span class="n">'+C.items.length+'</span></button>'
    +cats.map(c=>{const n=C.items.filter(i=>i.categoria===c.id).length;
      return '<button class="tab'+(filtro===c.id?' on':'')+'" data-f="'+c.id+'">'+esc(c.tab||c.nombre)+'<span class="n">'+n+'</span></button>';}).join('');
  const cat=cats.find(c=>c.id===filtro);
  const vis=C.items.filter(i=>filtro==='todos'||i.categoria===filtro);
  document.getElementById('app').innerHTML=
    '<header><h1>Catálogo</h1><span class="rate">1 ¥ = US$ '+M.tasa_cny_usd+' · '+M.tasa_fecha+' · goofish.com</span></header>'
    +'<nav class="tabs">'+tabs+'</nav>'
    +(cat?'<p class="catnote">'+esc(cat.objetivo)+'</p>':'<p class="catnote">Todo lo verificado, en todas las categorías.</p>')
    +'<div class="grid">'+(vis.length?vis.map(tarjeta).join(''):'<div class="empty">Todavía no hay nada verificado en esta categoría.</div>')+'</div>'
    +'<details class="rejs"><summary>Descartados y por qué ('+C.descartados.length+')</summary>'
    +C.descartados.map(d=>'<div class="rej"><b>'+esc(d.titulo)+'</b> — &yen;'+d.precio_cny+' · US$ '+usd(d.precio_cny)
      +'<p>'+esc(d.motivo)+'</p><div class="raw"><a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.url)+'</a></div></div>').join('')
    +'</details>'
    +'<footer>Miniaturas servidas por el CDN de Goofish. Última actualización: '+M.tasa_fecha+'.</footer>';
  activarCarr(document.getElementById('app'));
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;pintar();window.scrollTo({top:0});});
  document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>abrir(b.dataset.ver));
}

const ov=document.getElementById('ov'), md=document.getElementById('md');
function abrir(id){
  const it=C.items.find(x=>x.id===id); if(!it)return;
  md.innerHTML=detalle(it); ov.classList.add('on'); document.body.style.overflow='hidden';
  activarCarr(md); document.getElementById('cx').onclick=cerrar; md.scrollIntoView();
}
function cerrar(){ov.classList.remove('on');md.innerHTML='';document.body.style.overflow='';}
ov.onclick=e=>{if(e.target===ov)cerrar();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();});
pintar();
</script>
</body>
</html>
